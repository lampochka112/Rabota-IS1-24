<!DOCTYPE html>
<html>
<head>
    <style>
        .btn {
            background: blue;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
            margin: 20px;
        }
        
        #window {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }
        
        #window:target {
            display: block;
        }
        
        .popup {
            width: 300px;
            background: white;
            padding: 20px;
            border: 2px solid blue;
            text-align: center;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <a href="https://ru.wikipedia.org/wiki/%D0%92%D0%B8%D0%BA%D0%B8" class="btn">Выдать испытывающее окно</a>
    
    <div id="https://ru.wikipedia.org/wiki/%D0%92%D0%B8%D0%BA%D0%B8">
        <div class="popup">
            <p>Всплывающее окно!</p>
            <a href="https://ru.wiktionary.org/wiki/%D0%B1%D0%B8%D0%B7%D0%BD%D0%B5%D1%81" class="close">Закрыть окно</a>
        </div>
    </div>
</body>
</html>
